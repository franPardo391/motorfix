<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   <!-- Para que se adapte al móvil -->
    <title>MotorFix - Panel Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">  <!-- Tipografías del diseño -->
    <link rel="stylesheet" href="../css/administrador.css">                   <!-- Estilos de esta vista -->
    <script src="../js/administrador.js"></script>                            <!-- View controller de esta vista -->
</head>
<body>

    <header class="barra">                                                    <!-- Barra azul superior -->
        <div class="marca">
            <span class="logo">MotorFix</span>
            <span class="rol">Administrador</span>
        </div>
        <div class="usuario">
            <span id="nombreUsuario"></span>                                  <!-- El JS pone el nombre (de la sesión) -->
            <button type="button" class="btn-barra" onclick="logout()">Cerrar sesión</button>
        </div>
    </header>

    <main class="contenido">

        <section class="bloque">
            <div class="cabecera">
                <div>
                    <h2>Métricas del taller</h2>
                    <p class="subtitulo">Resumen de citas y facturación.</p>
                </div>
            </div>
            <div class="metricas">                                            <!-- El JS rellena cada número -->
                <div class="metrica"><span id="numPendiente"  class="numero">-</span><span class="etiqueta">Pendientes</span></div>
                <div class="metrica"><span id="numAsignada"   class="numero">-</span><span class="etiqueta">Asignadas</span></div>
                <div class="metrica"><span id="numReparacion" class="numero">-</span><span class="etiqueta">En reparación</span></div>
                <div class="metrica"><span id="numFinalizada" class="numero">-</span><span class="etiqueta">Finalizadas</span></div>
                <div class="metrica"><span id="numFacturas"   class="numero">-</span><span class="etiqueta">Facturas emitidas</span></div>
                <div class="metrica"><span id="numFacturado"  class="numero">-</span><span class="etiqueta">Total facturado</span></div>
            </div>
        </section>

        <section class="bloque">
            <div class="cabecera">
                <h2>Usuarios</h2>
                <button type="button" class="btn-prim" onclick="mostrarFormUsuario()">Nuevo usuario</button>
            </div>

            <div id="formUsuario" class="panel oculto">                       <!-- Oculto hasta pulsar "Nuevo usuario" -->
                <h3>Nuevo usuario</h3>
                <div class="campos">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" maxlength="100" placeholder="Luis Mecánico">
                    </div>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" maxlength="150" placeholder="luis@motorfix.es">
                    </div>
                </div>
                <div class="campos campo-ancho">
                    <div class="campo">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password">
                    </div>
                    <div class="campo">
                        <label for="rol">Rol</label>
                        <select id="rol">                                     <!-- Cliente no: se registra él con su ficha -->
                            <option value="Mecanico">Mecánico</option>
                            <option value="Oficina">Oficina</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                </div>
                <div class="acciones">
                    <button type="button" class="btn-prim" onclick="guardarUsuario()">Guardar</button>
                    <button type="button" class="btn-sec" onclick="ocultarFormUsuario()">Cancelar</button>
                </div>
            </div>

            <table class="tabla">
                <thead>
                    <tr>
                        <th>Nombre</th><th>Email</th><th>Rol</th><th></th>
                    </tr>
                </thead>
                <tbody id="tablaUsuarios"></tbody>                            <!-- El JS mete una fila por usuario -->
            </table>
            <p id="msgUsuario" class="msg"></p>                               <!-- Mensajes de usuario_sw -->
        </section>

    </main>

</body>
</html>
