<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   <!-- Para que se adapte al móvil -->
    <title>MotorFix - Panel Cliente</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">  <!-- Tipografías del diseño -->
    <link rel="stylesheet" href="../css/cliente.css">                         <!-- Estilos de esta vista -->
    <script src="../js/cliente.js"></script>                                  <!-- View controller de esta vista -->
</head>
<body>

    <header class="barra">                                                    <!-- Barra azul superior -->
        <div class="marca">
            <span class="logo">MotorFix</span>
            <span class="rol">Cliente</span>
        </div>
        <div class="usuario">
            <span id="nombreUsuario"></span>                                  <!-- El JS pone el nombre (de la sesión) -->
            <button type="button" class="btn-barra" onclick="logout()">Cerrar sesión</button>
        </div>
    </header>

    <main class="contenido">

        <section class="saludo">
            <h1>Hola, <span id="saludoNombre"></span></h1>                    <!-- También lo rellena el JS -->
            <p>Aquí tienes el estado de tus reparaciones, tus vehículos y tus facturas.</p>
        </section>

        <section class="bloque">                                              <!-- Bloque · Tus reparaciones -->
            <div class="cabecera">
                <h2>Tus reparaciones</h2>
                <button type="button" class="btn-prim" onclick="mostrarFormCita()">Pedir cita</button>
            </div>

            <div id="formCita" class="panel oculto">                          <!-- Oculto hasta pulsar "Pedir cita" -->
                <h3>Pedir cita</h3>
                <div class="campos">
                    <div class="campo">
                        <label for="citaVehiculo">Vehículo</label>
                        <select id="citaVehiculo"></select>                   <!-- El JS mete un <option> por cada coche suyo -->
                    </div>
                    <div class="campo">
                        <label for="citaFecha">Fecha y hora</label>
                        <input type="datetime-local" id="citaFecha">          <!-- Calendario + hora del navegador -->
                    </div>
                </div>
                <div class="campo campo-ancho">
                    <label for="citaDescripcion">Motivo</label>
                    <textarea id="citaDescripcion" rows="3" placeholder="Ej.: ruido al frenar, revisión de los 100.000 km..."></textarea>
                </div>
                <div class="acciones">
                    <button type="button" class="btn-prim" onclick="guardarCita()">Enviar solicitud</button>
                    <button type="button" class="btn-sec" onclick="ocultarFormCita()">Cancelar</button>
                </div>
                <p id="msgCita" class="msg"></p>                              <!-- Mensaje del JSON de cita_sw -->
            </div>

            <div id="listaReparaciones"></div>                                <!-- El JS mete una tarjeta por cita -->
        </section>

        <section class="bloque">                                              <!-- Bloque · Tus vehículos -->
            <div class="cabecera">
                <h2>Tus vehículos</h2>
                <button type="button" class="btn-sec" onclick="mostrarFormulario()">Añadir vehículo</button>
            </div>

            <table class="tabla">
                <thead>
                    <tr>
                        <th>Matrícula</th><th>Marca</th><th>Modelo</th><th>Año</th><th>Kilómetros</th><th></th>
                    </tr>
                </thead>
                <tbody id="tablaVehiculos"></tbody>                           <!-- Vacío: el JS mete una fila por vehículo -->
            </table>

            <div id="formVehiculo" class="panel oculto">                      <!-- Oculto hasta pulsar Añadir o Editar -->
                <h3 id="tituloForm">Añadir vehículo</h3>
                <input type="hidden" id="id_vehiculo">                        <!-- Vacío = insert, con número = update -->

                <div class="campos">
                    <div class="campo">
                        <label for="matricula">Matrícula</label>
                        <input type="text" id="matricula" placeholder="1234 ABC" maxlength="10">
                    </div>
                    <div class="campo">
                        <label for="marca">Marca</label>
                        <input type="text" id="marca" placeholder="Seat">
                    </div>
                    <div class="campo">
                        <label for="modelo">Modelo</label>
                        <input type="text" id="modelo" placeholder="Ibiza">
                    </div>
                    <div class="campo">
                        <label for="anio">Año</label>
                        <input type="number" id="anio" placeholder="2018">
                    </div>
                    <div class="campo">
                        <label for="kilometraje">Kilómetros</label>
                        <input type="number" id="kilometraje" placeholder="85000">
                    </div>
                </div>

                <div class="acciones">
                    <button type="button" class="btn-prim" onclick="guardarVehiculo()">Guardar</button>
                    <button type="button" class="btn-sec" onclick="ocultarFormulario()">Cancelar</button>
                </div>
                <p id="msg" class="msg"></p>                                  <!-- Mensaje del JSON (ok o error) -->
            </div>
        </section>

        <section class="bloque">                                              <!-- Bloque · Tus facturas -->
            <div class="cabecera">
                <h2>Tus facturas</h2>
            </div>
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Número</th><th>Fecha</th><th>Vehículo</th><th>Concepto</th><th>Total</th><th></th>
                    </tr>
                </thead>
                <tbody id="tablaFacturas"></tbody>                            <!-- El JS mete una fila por factura -->
            </table>
        </section>

    </main>
</body>
</html>
