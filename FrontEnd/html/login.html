<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">   <!-- Para que se adapte al móvil -->
    <title>MotorFix - Iniciar sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">  <!-- Tipografías del diseño -->
    <link rel="stylesheet" href="../css/login.css">                           <!-- Estilos de esta vista -->
    <script src="../js/login.js"></script>                                    <!-- View controller de esta vista -->
</head>
<body>
    <main class="pantalla">

        <section class="lateral">                                             <!-- Mitad izquierda, azul -->
            <h1>MotorFix</h1>
            <p>Gestión del taller sin papeles.</p>
        </section>

        <section class="formulario">                                          <!-- Mitad derecha, formulario -->
            <h2>Iniciar sesión</h2>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.es">

            <label for="password">Contraseña</label>
            <input type="password" id="password">

            <button type="button" id="btnLogin" onclick="login()">Entrar</button>   <!-- type=button: NUNCA submit -->

            <p id="msg" class="msg"></p>                                       <!-- Aquí el JS escribe el msg del JSON -->

            <p class="enlace">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </section>

    </main>
</body>
</html>
